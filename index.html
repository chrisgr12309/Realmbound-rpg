<script>
/* Mobile input and save support */
(function(){
  const STORE_KEY = "realmbound_save_v3";
  let loaded = null;
  try { loaded = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch(e) {}
  window.__rbLoaded = loaded;
  let saveTimer=null;
  window.__rbSave = function(data){
    clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
      const s=document.getElementById("saveStatus");
      if(s) s.textContent="Opgeslagen ✓";
    } catch(e) {
      const s=document.getElementById("saveStatus");
      if(s) s.textContent="Opslaan niet beschikbaar in deze browser";
    } },250);
  };
  window.__rbClear = function(){
    try { localStorage.removeItem(STORE_KEY); } catch(e) {}
  };
  document.addEventListener("contextmenu",e=>e.preventDefault());
})();
</script>

<script>
(()=>{
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:1450,h:980};
const classes={
 Warrior:{hp:120,damage:15,speed:3.1,skill:'Draaiende slag',desc:'Veel HP en sterke zwaardaanvallen',color:'#e9c38a'},
 Mage:{hp:85,damage:19,speed:2.9,skill:'Arcane bol',desc:'Magische aanval op middellange afstand',color:'#8dc8ff'},
 Archer:{hp:95,damage:14,speed:3.5,skill:'Dubbele pijl',desc:'Snelle aanvallen op afstand',color:'#9be39b'},
 Assassin:{hp:90,damage:17,speed:4,skill:'Schaduwsteek',desc:'Snel en hoge aanvalsschade',color:'#c6a0ec'},
 Paladin:{hp:135,damage:12,speed:2.8,skill:'Heilige golf',desc:'Veel HP en een genezende kracht',color:'#ffe08a'},
 Berserker:{hp:145,damage:22,speed:2.7,skill:'Woede-uitbarsting',desc:'Zeer hoge schade, maar langzaam',color:'#e36a58'},
 Ninja:{hp:82,damage:18,speed:4.5,skill:'Schaduwstorm',desc:'Heel snel, maar weinig HP',color:'#9a9cae'},
 Pirate:{hp:110,damage:16,speed:3.3,skill:'Kanonschot',desc:'Gebalanceerd en extra muntbeloningen',color:'#d5b66c'}
};
let chosen='Warrior',p={x:270,y:310,hp:120,max:120,damage:15,speed:3.1,level:1,xp:0,next:35,coins:0,skillPoints:0,kills:0,questClaimed:false,inventory:[],questFlags:{},crafts:0,stats:{strength:0,agility:0,defense:0,intellect:0,hp:0},statPoints:0,gear:[],equipped:[],potions:0,armor:0,bossKills:0,bestiary:{},achievements:{},titles:[],unlockedZones:[0],visitedCities:['Beginner Village'],lastSkill:0},keys={},mobs=[],cam={x:0,y:0},last=0;
const saved=window.__rbLoaded;
if(saved){
  if(classes[saved.chosen]) chosen=saved.chosen;
  Object.assign(p, saved.player || {});
  const cl=classes[chosen];
  p.speed=cl.speed; p.inventory=p.inventory||[]; p.questFlags=p.questFlags||{}; p.crafts=p.crafts||0;p.stats=p.stats||{strength:0,agility:0,defense:0,intellect:0,hp:0};p.statPoints=p.statPoints||0;p.gear=p.gear||[];p.equipped=p.equipped||[];p.potions=p.potions||0;p.bestiary=p.bestiary||{};p.achievements=p.achievements||{};p.titles=p.titles||[];p.unlockedZones=p.unlockedZones||[0];p.visitedCities=p.visitedCities||['Beginner Village'];p.bossKills=p.bossKills||0;p.lastSkill=p.lastSkill||0;
}
function saveGame(){
  window.__rbSave({chosen,player:{x:p.x,y:p.y,hp:p.hp,max:p.max,damage:p.damage,level:p.level,xp:p.xp,next:p.next,coins:p.coins,skillPoints:p.skillPoints,kills:p.kills,questClaimed:p.questClaimed,inventory:p.inventory,questFlags:p.questFlags,crafts:p.crafts,stats:p.stats,statPoints:p.statPoints,gear:p.gear,equipped:p.equipped,potions:p.potions,armor:p.armor,bossKills:p.bossKills,bestiary:p.bestiary,achievements:p.achievements,titles:p.titles,unlockedZones:p.unlockedZones,visitedCities:p.visitedCities,lastSkill:p.lastSkill}});
}

const zones=[
  {name:'Beginner Forest',x:0,y:0,w:500,h:980,min:1,max:8,kind:'slime'},
 {name:'Green Valley',x:500,y:0,w:470,h:980,min:8,max:20,kind:'wolf'},
 {name:'Shadow Forest',x:970,y:0,w:480,h:980,min:20,max:35,kind:'golem'}
];
const trees=[];for(let i=0;i<75;i++){let x=(i*181+91)%world.w,y=(i*293+57)%world.h;trees.push({x,y,r:14+i%4*3})}
function zoneAt(x){return zones.find(z=>x>=z.x&&x<z.x+z.w)||zones[2]}
function spawn(x,y,z){let lv=z.min+Math.floor(Math.random()*(z.max-z.min+1));let type=z.kind;let base=type==='slime'?32:type==='wolf'?48:65;mobs.push({x,y,lv,type,hp:base+lv*9,max:base+lv*9,damage:3+lv*2,r:type==='golem'?19:14,hit:0,dead:0,element:type==='slime'?'nature':type==='wolf'?'ice':'earth'})}
for(const z of zones)for(let i=0;i<8;i++)spawn(z.x+65+Math.random()*(z.w-120),100+Math.random()*1050,z);
const village={x:220,y:720,r:105};
function nearVillage(){return Math.hypot(p.x-village.x,p.y-village.y)<165}
function interact(){
 if(nearVillage()){openVillage();return}
 if(Math.hypot(p.x-220,p.y-545)<85){toast('Bordje: Beginner Village ↓');return}
 toast('Geen NPC dichtbij. Zoek het dorp in het zuiden!')
}
function openVillage(){
 p.questFlags.visited=true;saveGame();
 document.getElementById('modalTitle').textContent='Beginner Village';
 const body=document.getElementById('modalBody');
 body.innerHTML=`<p>Welkom in Beginner Village! Praat met de bewoners.</p>
 <button onclick="villageShop('buy')">🛒 Winkel — koop drankjes</button>
 <button onclick="villageShop('sell')">💰 Verkopen — verkoop loot</button>
 <button onclick="villageShop('craft')">🔨 Crafting — maak uitrusting</button>
 <button onclick="showPanel('classes')">⚔️ Class trainer — wissel class</button>
 <button onclick="showPanel('quests')">📜 Questbord</button>`;
 document.getElementById('modal').style.display='flex';
}
function villageShop(mode){
 const body=document.getElementById('modalBody');
 document.getElementById('modalTitle').textContent=mode==='buy'?'Winkel':mode==='sell'?'Verkopen':'Crafting';
 if(mode==='buy') body.innerHTML=`<p>Rode drank — herstel 45 HP. Kosten: 20 munten.</p><button onclick="buyPotion()">Koop drankje (20 🪙)</button>`;
 if(mode==='sell') body.innerHTML=`<p>Je loot: ${p.inventory.length? p.inventory.join(', '):'nog niets'}</p><button onclick="sellLoot()">Verkoop alle loot (+8 munten per item)</button>`;
 if(mode==='craft') body.innerHTML=`<p>Maak een bosamulet met 2 loot-items. Geeft +3 schade.</p><p>Loot in tas: ${p.inventory.length}</p><button onclick="craftAmulet()">Craft bosamulet (2 items)</button>`;
}
window.buyPotion=()=>{if(p.coins<20){toast('Niet genoeg munten!');return}p.coins-=20;p.inventory.push('Rode drank');toast('Rode drank gekocht!');hud();villageShop('buy');saveGame()};
window.sellLoot=()=>{const items=p.inventory.filter(x=>x!=='Rode drank'&&x!=='Bosamulet');if(!items.length){toast('Geen loot om te verkopen');return}p.coins+=items.length*8;p.inventory=p.inventory.filter(x=>x==='Rode drank'||x==='Bosamulet');toast('Loot verkocht!');hud();villageShop('sell');saveGame()};
window.craftAmulet=()=>{if(p.inventory.length<2){toast('Je hebt 2 loot-items nodig');return}p.inventory.splice(0,2);p.inventory.push('Bosamulet');p.damage+=3;p.crafts++;toast('Bosamulet gemaakt: +3 schade!');hud();villageShop('craft');saveGame()};
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1600)}
function hud(){document.getElementById('who').textContent=chosen+' · Lv. '+p.level;document.getElementById('hp').textContent=Math.ceil(p.hp)+'/'+p.max;document.getElementById('hpFill').style.width=p.hp/p.max*100+'%';document.getElementById('xp').textContent=p.xp+'/'+p.next;document.getElementById('xpFill').style.width=p.xp/p.next*100+'%';document.getElementById('coins').textContent=p.coins;document.getElementById('dmg').textContent=p.damage;document.getElementById('kills').textContent=Math.min(p.kills,3)+'/3';let z=zoneAt(p.x);document.getElementById('area').textContent=(nearVillage()?'Beginner Village':z.name)+' · Lv.'+z.min+'-'+z.max;saveGame()}
function gain(n){p.xp+=n;while(p.xp>=p.next){p.xp-=p.next;p.level++;p.next=Math.floor(p.next*1.32+8);p.max+=8;p.hp=p.max;p.damage+=2;p.skillPoints++;p.statPoints=(p.statPoints||0)+3;if(p.level>=8&&!p.unlockedZones.includes(1))p.unlockedZones.push(1);if(p.level>=20&&!p.unlockedZones.includes(2))p.unlockedZones.push(2);applyStats();toast('LEVEL UP! Level '+p.level+' · +3 statpunten')}hud()}
function selectClass(name){chosen=name;let a=classes[name];p.max=a.hp+(p.level-1)*8;p.hp=p.max;p.damage=a.damage+(p.level-1)*2;p.speed=a.speed;hidePanel();hud();saveGame();toast(name+' gekozen!')}
function hit(skill){
 let reach=chosen==='Mage'||chosen==='Archer'?145:68;
 let targets=mobs.filter(m=>m.hp>0&&Math.hypot(m.x-p.x,m.y-p.y)<reach).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));
 if(!targets.length){toast('Geen monster dichtbij!');return}
 for(let m of targets.slice(0,skill?3:1)){
  m.hp-=p.damage*(skill?2.1:1);
  if(m.hp<=0){m.hp=0;m.dead=450;p.kills++;p.coins+=5+m.lv*3;
   const label=m.bossName||(m.type==='slime'?'Forest Slime':m.type==='wolf'?'Valley Wolf':'Stone Golem');
   p.bestiary[label]=(p.bestiary[label]||0)+1;
   const material=m.type==='slime'?'Slijmgel':m.type==='wolf'?'Wolvenvacht':'Ruw gesteente';
   if(Math.random()<.35){p.inventory.push(material);toast('Materiaal gevonden: '+material)}
   if(!m.boss&&Math.random()<(m.type==='slime'?.10:.075)){let armor=m.type==='slime'?'Slijm-armor':m.type==='wolf'?'Wolven-armor':'Golem-armor';p.gear.push(armor);p.inventory.push(armor);toast('Armor gevonden: '+armor+'!')}
   if(m.boss){p.bossKills++;let w=m.bossWeapon||'Uniek bosswapen';p.gear.push(w);p.inventory.push(w);toast('Boss verslagen! Uniek wapen: '+w)}
   if(p.kills>=50&&!p.achievements.hunter50){p.achievements.hunter50=true;p.titles.push('Hunter');p.coins+=50;toast('Achievement: Hunter!')}
   if(p.kills>=100&&!p.achievements.hunter100){p.achievements.hunter100=true;p.titles.push('Monster Slayer');p.coins+=100;toast('Achievement: Monster Slayer!')}
   gain(10+m.lv*7);
  }
 }
 hud();saveGame();
}
function useSkill(){let now=Date.now();if(now-(p.lastSkill||0)<12000){toast('Skill cooldown: '+Math.ceil((12000-(now-p.lastSkill))/1000)+' sec');return}p.lastSkill=now;let a=classes[chosen];if(chosen==='Paladin'){p.hp=Math.min(p.max,p.hp+35);toast('Heilige kracht: +35 HP!');hud();saveGame();return}hit(true);toast(a.skill+'!')}
function openMore(){document.getElementById('modalTitle').textContent='Meer';document.getElementById('modalBody').innerHTML=`<div class="classGrid">
<button class="classCard" onclick="showPanel('map')"><b>🗺️ Wereldmap</b><small>Gebieden en travel</small></button>
<button class="classCard" onclick="showPanel('bestiary')"><b>📖 Monsterboek</b><small>Monsters en drops</small></button>
<button class="classCard" onclick="showPanel('achievements')"><b>🏆 Achievements</b><small>Prestaties en titels</small></button>
<button class="classCard" onclick="showPanel('inventory')"><b>🎒 Inventory / Gear</b><small>Items aandoen</small></button>
<button class="classCard" onclick="showPanel('skills')"><b>✨ Stats</b><small>Punten verdelen</small></button>
<button class="classCard" onclick="showPanel('dungeons')"><b>🌀 Dungeons</b><small>Spawninformatie</small></button>
<button class="classCard" onclick="showPanel('quests')"><b>📜 Missies</b><small>Questbord</small></button>
<button class="classCard" onclick="showPanel('travel')"><b>🚪 Fast Travel</b><small>Vanaf level 20 · gebieden</small></button><button class="classCard" onclick="showPanel('citytravel')"><b>🏘️ City Travel</b><small>Alleen tussen steden</small></button>
<button class="classCard" onclick="showPanel('classes')"><b>⚔️ Classes</b><small>Klasse kiezen</small></button></div>`}
function statTotal(k){return p.stats?.[k]||0}
function applyStats(){p.max=classes[chosen].hp+(p.level-1)*8+statTotal('hp')*10;p.damage=classes[chosen].damage+(p.level-1)*2+statTotal('strength')*2+statTotal('intellect');p.speed=classes[chosen].speed+statTotal('agility')*.035}
function spendStat(k){if(!p.statPoints){toast('Geen statpunten');return}p.stats[k]=(p.stats[k]||0)+1;p.statPoints--;applyStats();p.hp=Math.min(p.max,p.hp+10);showPanel('skills');hud();saveGame()}
function resetStats(){let cost=100+p.level*10;if(p.coins<cost){toast('Reset kost '+cost+' munten');return}p.coins-=cost;p.statPoints+=Object.values(p.stats).reduce((a,b)=>a+b,0);p.stats={strength:0,agility:0,defense:0,intellect:0,hp:0};applyStats();showPanel('skills');hud();saveGame()}
function equipItem(i){let item=p.gear[i];if(!item)return;p.equipped=[item];toast(item+' uitgerust!');showPanel('inventory');saveGame()}
function cityTravel(){if(!p.visitedCities.includes('Beginner Village')){toast('Ontdek de stad eerst');return}p.x=village.x;p.y=village.y;hidePanel();hud();saveGame();toast('Naar Beginner Village gereisd!')}
function fastTravel(i){if(p.level<20){toast('Fast Travel vanaf level 20');return}if(!p.unlockedZones.includes(i)){toast('Ontdek dit gebied eerst');return}p.x=zones[i].x+60;p.y=zones[i].y+300;hidePanel();hud();saveGame()}
let bossRespawnAt=[Date.now()+45000,Date.now()+90000,Date.now()+135000];
let dungeonSpawnAt=Date.now()+120000,dungeonEndsAt=0,dungeonZone=1,dungeonActive=false;
function spawnBoss(i){let z=zones[i],names=['Forest Guardian','Valley Colossus','Shadow Beast'],weapons=['Guardian Blade','Valley Crusher','Shadowfang'];if(mobs.some(m=>m.boss&&m.hp>0&&m.zone===i)){toast('Boss is al aanwezig');return}mobs.push({x:z.x+z.w*.7,y:world.h*.5,lv:z.max+2,type:i===0?'slime':i===1?'wolf':'golem',hp:450+i*350,max:450+i*350,damage:12+i*8,r:27,hit:0,dead:0,boss:true,zone:i,bossName:names[i],bossWeapon:weapons[i]});toast(names[i]+' verschenen!')}
function enterDungeon(){let i=zones.findIndex(z=>p.x>=z.x&&p.x<z.x+z.w);if(i===0){toast('Geen dungeons in Beginner Forest');return}if(!dungeonActive||Date.now()>dungeonEndsAt||i!==dungeonZone){toast('Geen actieve dungeon in dit gebied');return}for(let j=0;j<6;j++)spawn(p.x-70+Math.random()*140,p.y-70+Math.random()*140,zones[i]);dungeonActive=false;hidePanel();toast('Dungeon betreden! Versla alle monsters!')}
function drawMini(){let el=document.getElementById('mini');if(!el)return;let x=el.getContext('2d');x.clearRect(0,0,96,48);x.fillStyle='#356447';x.fillRect(0,0,33,48);x.fillStyle='#6b6849';x.fillRect(33,0,31,48);x.fillStyle='#3b3029';x.fillRect(64,0,32,48);x.fillStyle='white';x.beginPath();x.arc(p.x/world.w*96,p.y/world.h*48,3,0,7);x.fill()}
function showPanel(type){let modal=document.getElementById('modal'),body=document.getElementById('modalBody');modal.style.display='flex';

else if(type==='achievements'){document.getElementById('modalTitle').textContent='Achievements';body.innerHTML=`<p>Monsters verslagen: ${p.kills}</p><p>${p.kills>=10?'✅':'🔒'} 10 monsters — beloning 50 XP (claim via questbord)</p><p>${p.achievements.hunter50?'✅':'🔒'} 50 monsters — Hunter + 50 coins</p><p>${p.achievements.hunter100?'✅':'🔒'} 100 monsters — Monster Slayer + 100 coins</p><p>Bosses verslagen: ${p.bossKills}</p><p>Titels: ${p.titles.join(', ')||'Nog geen titels'}</p>`}

window.claimQuests=()=>{
 let msg=[];
 if(p.kills>=3&&!p.questFlags.q1){p.questFlags.q1=true;p.coins+=25;gain(40);msg.push('Jacht op slijmen')}
 if(p.inventory.length>=2&&!p.questFlags.q2){p.questFlags.q2=true;p.coins+=20;gain(30);msg.push('Verzamelaar')}
 if(p.questFlags.visited&&!p.questFlags.q3){p.questFlags.q3=true;p.coins+=15;gain(20);msg.push('Eerste bezoek')}
 toast(msg.length?'Beloningen: '+msg.join(', '):'Nog geen nieuwe beloningen');showPanel('quests');hud();saveGame();
};
function hidePanel(){document.getElementById('modal').style.display='none'}
function openQuest(){
  const done=p.kills>=3;
  const claimed=!!p.questClaimed;
  document.getElementById('modalTitle').textContent='Quest: Jacht op slijmen';
  const body=document.getElementById('modalBody');
  body.innerHTML=`<p><b>Opdracht:</b> Versla 3 monsters in de Startweide of andere gebieden.</p>
    <p><b>Voortgang:</b> ${Math.min(p.kills,3)}/3 monsters</p>
    <p><b>Beloning:</b> 40 XP en 25 munten</p>
    ${claimed?'<p>✅ Questbeloning is al opgehaald!</p>':done?'<p>🎉 Opdracht voltooid! Je kunt je beloning ophalen.</p>':'<p>Versla monsters en kom hier terug om je voortgang te bekijken.</p>'}
    <button id="questReward" ${(!done||claimed)?'disabled':''}>${claimed?'Beloning opgehaald':done?'Beloning ophalen':'Nog niet voltooid'}</button>`;
  document.getElementById('questReward').addEventListener('click',()=>{
    if(p.kills>=3&&!p.questClaimed){
      p.questClaimed=true;p.coins+=25;gain(40);toast('Quest voltooid! +40 XP en +25 munten');openQuest();hud();saveGame();
    }
  });
  document.getElementById('modal').style.display='flex';
}
document.getElementById('quest').addEventListener('click',()=>showPanel('quests'));
window.showPanel=showPanel;window.hidePanel=hidePanel;window.spendStat=spendStat;window.resetStats=resetStats;window.equipItem=equipItem;window.fastTravel=fastTravel;window.cityTravel=cityTravel;window.spawnBoss=spawnBoss;window.enterDungeon=enterDungeon;window.choose=selectClass;window.upgrade=()=>{if(p.skillPoints){p.skillPoints--;p.damage+=5;toast('Schade verbeterd!');showPanel('stats');hud()}else toast('Nog geen skillpunten!')};
function move(dx,dy){p.x=Math.max(20,Math.min(world.w-20,p.x+dx));p.y=Math.max(20,Math.min(world.h-20,p.y+dy))}
function draw(){g.clearRect(0,0,W,H);cam.x=Math.max(0,Math.min(world.w-W,p.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,p.y-H/2));g.save();g.translate(-cam.x,-cam.y);
for(let x=0;x<world.w;x+=70)for(let y=0;y<world.h;y+=70){let z=zoneAt(x);g.fillStyle=z.name==='Beginner Forest'?((x+y)%140?'#376747':'#3b704c'):z.name==='Green Valley'?((x+y)%140?'#47734b':'#527d50'):'#66543e';g.fillRect(x,y,70,70)}
// borders / paths
g.fillStyle='#9c875f';g.fillRect(0,210,world.w,28);g.fillRect(485,0,25,world.h);g.fillRect(955,0,25,world.h);
// Beginner Village and signpost inside Beginner Forest
g.fillStyle='#b89b68';g.fillRect(170,675,100,85);g.fillStyle='#744b32';g.fillRect(190,700,25,30);g.fillRect(225,700,25,30);g.fillStyle='#9b493c';g.beginPath();g.moveTo(160,678);g.lineTo(220,635);g.lineTo(280,678);g.fill();
g.fillStyle='#e6d39b';g.fillRect(212,520,8,38);g.fillStyle='#8c5a32';g.fillRect(220,520,78,24);g.fillStyle='#fff';g.font='bold 11px system-ui';g.fillText('VILLAGE ↓',225,537);
g.fillStyle='#fff';g.font='bold 25px system-ui';g.fillText('BEGINNER FOREST · LV 1-8',25,70);g.fillText('GREEN VALLEY · LV 8-20',530,70);g.fillText('SHADOW FOREST · LV 20-35',1000,70);
for(const t of trees){g.fillStyle='#49392c';g.fillRect(t.x-4,t.y,8,16);g.fillStyle='#1d4b30';g.beginPath();g.arc(t.x,t.y,t.r,0,7);g.fill();g.fillStyle='#32734a';g.beginPath();g.arc(t.x-5,t.y-5,t.r*.6,0,7);g.fill()}
// Village NPCs
for(const n of [{x:190,y:665,c:'#e7d0a0',name:'Smid'},{x:250,y:665,c:'#8ac9e8',name:'Winkel'},{x:220,y:780,c:'#d6a0e8',name:'Trainer'}]){g.fillStyle=n.c;g.beginPath();g.arc(n.x,n.y,11,0,7);g.fill();g.fillStyle='white';g.font='10px system-ui';g.textAlign='center';g.fillText(n.name,n.x,n.y-17)}
for(const m of mobs){if(m.hp<=0)continue;g.fillStyle=m.type==='slime'?'#65d58b':m.type==='wolf'?'#9ba8b3':'#b18b69';g.beginPath();g.arc(m.x,m.y,m.r,0,7);g.fill();g.fillStyle='#18231f';g.fillRect(m.x-4,m.y-3,3,3);g.fillRect(m.x+4,m.y-3,3,3);g.fillStyle='#1b1b1b';g.fillRect(m.x-19,m.y-m.r-13,38,5);g.fillStyle='#e75a60';g.fillRect(m.x-19,m.y-m.r-13,38*m.hp/m.max,5);g.fillStyle='white';g.font='11px system-ui';g.textAlign='center';g.fillText((m.boss?(m.bossName||'Boss'):(m.type==='slime'?'Slijm':m.type==='wolf'?'Wolf':'Golem'))+' Lv.'+m.lv,m.x,m.y-m.r-17)}
g.fillStyle='#202c46';g.beginPath();g.arc(p.x,p.y+3,17,0,7);g.fill();g.fillStyle=classes[chosen].color;g.beginPath();g.arc(p.x,p.y-2,12,0,7);g.fill();g.fillStyle='#fff';g.font='12px system-ui';g.textAlign='center';g.fillText(chosen,p.x,p.y-24);g.restore();g.textAlign='left'}
function frame(t){let dt=Math.min((t-last)/16.67||1,2);last=t;
if(Date.now()>=dungeonSpawnAt){dungeonActive=true;dungeonZone=dungeonZone===1?2:1;dungeonEndsAt=Date.now()+900000;dungeonSpawnAt=Date.now()+600000;toast((dungeonZone===1?'E/D-rank':'C/B-rank')+' dungeon verschenen in '+zones[dungeonZone].name+'!')}
for(let bi=0;bi<3;bi++){if(Date.now()>=bossRespawnAt[bi]&&!mobs.some(m=>m.boss&&m.hp>0&&m.zone===bi)){spawnBoss(bi);bossRespawnAt[bi]=Date.now()+600000}}
let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);move(dx/l*p.speed*dt,dy/l*p.speed*dt)}
for(let m of mobs){if(m.hp<=0){
  m.dead-=dt;
  if(m.dead<=0){
    if(m.boss){bossRespawnAt[m.zone]=Date.now()+600000;m.hp=-999;m.dead=-999;continue;}
    let z=zones.find(z=>m.x>=z.x&&m.x<z.x+z.w)||zones[0];
    let lv=z.min+Math.floor(Math.random()*(z.max-z.min+1));
    let base=m.type==='slime'?32:m.type==='wolf'?48:65;
    m.lv=lv;m.max=base+lv*9;m.hp=m.max;m.damage=3+lv*2;
    m.x=z.x+65+Math.random()*(z.w-120);m.y=100+Math.random()*1050;m.dead=0;
  }
  continue;
}let d=Math.hypot(p.x-m.x,p.y-m.y);if(d<210&&d>25){m.x+=(p.x-m.x)/d*.55*dt;m.y+=(p.y-m.y)/d*.55*dt}if(d<27){m.hit-=dt;if(m.hit<=0){p.hp-=Math.max(1,m.damage-(statTotal('defense')*1.5));if(p.hp<=0){p.hp=p.max;p.x=220;p.y=300;toast('Je bent terug naar het startdorp gebracht.')}m.hit=60;hud()}}}
draw();drawMini();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function bind(id,k){
 const el=document.getElementById(id);
 const start=e=>{e.preventDefault();keys[k]=true;};
 const stop=e=>{keys[k]=false;};
 el.addEventListener('pointerdown',start);
 window.addEventListener('pointerup',stop);
 window.addEventListener('pointercancel',stop);
 el.addEventListener('touchstart',start,{passive:false});
 el.addEventListener('touchend',stop,{passive:true});
}
bind('up','up');bind('down','down');bind('left','left');bind('right','right');
document.getElementById('interact').addEventListener('pointerdown',e=>{e.preventDefault();interact()});document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();hit(false)});document.getElementById('skillBtn').addEventListener('pointerdown',e=>{e.preventDefault();useSkill()});
hud();draw();document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});window.addEventListener('pagehide',saveGame);
})();
